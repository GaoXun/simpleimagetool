[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "imgtool"
version = "0.1.0"
description = "A small command-line image processing utility"
requires-python = ">=3.11"
dependencies = ["Pillow"]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
